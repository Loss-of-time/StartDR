[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "StartDR"
version = "0.1.0"
description = "DrugRec 检索与检索后精排训练的双子项目工程。"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cattrs",
    "jaxtyping",
    "jieba",
    "neo4j",
    "pyright>=1.1.405",
    "pyserini",
    "rank-bm25",
    "socksio",
    "tqdm",
    "torch",
    "torch-geometric",
    "transformers",
    "viztracer>=1.1.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
function-graph = "function_graph.analysis_cli:main"
patient-candidates = "drretrieval.patient_candidates:main"
retriever-eval = "drretrieval.retriever_eval:main"
rerank-4sdrug-export = "drrerank.foursdrug_export:main"
rerank-4sdrug-train = "drrerank.foursdrug_train:main"
rerank-gat-train = "drrerank.gat_train:main"
rerank-import-tracedr = "drrerank.import_tracedr:main"
rerank-kgd-export = "drrerank.kgd_export:main"
rerank-kgd-train = "drrerank.kgd_train:main"
rerank-tracedr-train = "drrerank.tracedr_train:main"
treeify-function-graph = "function_graph.treeify_cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F821", "F722", "UP037"]

[tool.pyright]
include = ["src"]
exclude = ["resource", "output", ".venv", "**/node_modules", "**/__pycache__", "**/.*"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
useLibraryCodeForTypes = false

[tool.hatch.build.targets.wheel]
packages = ["src/drretrieval", "src/drrerank", "src/function_graph"]
