[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "StartDR"
version = "0.1.0"
description = "DrugRec 检索与检索后精排训练的双子项目工程。"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cattrs",
    "jaxtyping",
    "jieba",
    "neo4j",
    "pyserini",
    "rank-bm25",
    "tqdm",
    "torch",
    "transformers",
    "viztracer>=1.1.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
patient-candidates = "drretrieval.patient_candidates:main"
retriever-eval = "drretrieval.retriever_eval:main"
rerank-build-data = "drrerank.build_data:main"
rerank-train = "drrerank.train:main"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F821", "F722", "UP037"]

[tool.hatch.build.targets.wheel]
packages = ["src/drretrieval", "src/drrerank"]
